<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic / Animated Background Graphics (Pills & Tech Nodes behind text) -->
  <g opacity="0.25">
    <!-- Grid pattern lines -->
    <line x1="0" y1="75" x2="1200" y2="75" stroke="#6366f1" stroke-width="1" stroke-dasharray="5,5" />
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#6366f1" stroke-width="1" stroke-dasharray="5,5" />
    <line x1="0" y1="225" x2="1200" y2="225" stroke="#6366f1" stroke-width="1" stroke-dasharray="5,5" />
    
    <!-- Floating Tech Pill Graphics in background -->
    <rect x="80" y="40" width="140" height="36" rx="18" fill="url(#accentGrad)">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite" />
    </rect>
    <rect x="950" y="210" width="160" height="40" rx="20" fill="url(#accentGrad)">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite" />
    </rect>

    <!-- Glowing Orbs -->
    <circle cx="150" cy="220" r="90" fill="#6366f1" filter="url(#glow)" opacity="0.3" />
    <circle cx="1050" cy="80" r="110" fill="#ec4899" filter="url(#glow)" opacity="0.3" />
  </g>

  <!-- Decorative Shield Icon (Right Side Background) -->
  <g transform="translate(920, 50)" opacity="0.4">
    <path d="M 100 0 L 200 40 V 120 C 200 180 100 230 100 230 C 100 230 0 180 0 120 V 40 Z" fill="url(#shieldGrad)" stroke="#a855f7" stroke-width="3" />
    <!-- Lock symbol inside shield -->
    <rect x="70" y="100" width="60" height="50" rx="6" fill="#f43f5e" />
    <path d="M 80 100 V 80 C 80 65 120 65 120 80 V 100" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" />
  </g>

  <!-- Foreground Content (Title & Subtitle Guaranteed Clear) -->
  <g transform="translate(80, 0)">
    <!-- Category Tag / Pill -->
    <g transform="translate(0, 45)">
      <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
      <text x="160" y="21" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">INFORMATION PROTECTION &amp; IRM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
      Awesome Information Protection
    </text>
    <text x="0" y="175" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      &amp; Rights Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="225" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Enterprise Digital Rights Management (EDRM), Persistent Encryption &amp; Data-Centric Security
    </text>

    <!-- Bottom Tech Tags -->
    <g transform="translate(0, 250)">
      <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
        🔒 Persistent Encryption  •  📜 Dynamic Policy  •  👁️ DRM / IRM  •  🛡️ Microsoft Purview &amp; Open-Source
      </text>
    </g>
  </g>
</svg>
